[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-party-generator"
version = "0.1.0"
description = "Local anime image generator with three INT8 quality tiers and optional Ollama prompt enhancement"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "diffusers>=0.39,<1.0",
    "transformers>=4.47",
    "accelerate>=0.27",
    # 0.2.7 requires torch>=2.6, while the supported CUDA 12.1 wheel is 2.5.1.
    "optimum-quanto==0.2.6",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "typer>=0.12",
    "gradio>=4.30",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
animegen = "animegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
animegen = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
