[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-generator"
version = "0.1.0"
description = "Local anime image generator with three quality tiers, INT8 linear weights, and optional Ollama"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
    "torch==2.13.0",
    "diffusers==0.39.*",
    "transformers>=5.14.1,<6",
    "accelerate>=1.14,<2",
    "optimum-quanto==0.2.7",
    "safetensors>=0.8,<1",
    "requests>=2.31,<3",
    "typer>=0.12,<1",
    "pillow>=10,<13",
]

[project.optional-dependencies]
ui = ["gradio>=6.20,<7"]
dev = ["pytest>=8,<10", "pyyaml>=6,<7"]

[project.scripts]
animegen = "animegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
