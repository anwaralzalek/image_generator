# Anime Party Generator — all tunables live here.
#
# Every value can be overridden by an environment variable using the
# ANIMEGEN_ prefix and "__" as the nesting delimiter, e.g.
#   ANIMEGEN_GENERATION__STEPS=8
#   ANIMEGEN_OLLAMA__HOST=http://127.0.0.1:11434
# Environment variables win over this file.
#
# A different config file can be selected with ANIMEGEN_CONFIG_FILE=/path/to.yaml

paths:
  models_dir: models
  outputs_dir: outputs

model:
  # Single-file SDXL checkpoint, loaded with StableDiffusionXLPipeline.from_single_file().
  checkpoint_filename: DreamShaperXL_v2_Turbo.safetensors
  # Display name recorded in output metadata sidecars.
  checkpoint_name: DreamShaper XL v2 Turbo
  # Optional direct download URL (Civitai links may need an API token; see
  # scripts/download_models.py --url). Left blank on purpose: no hardcoded link.
  checkpoint_url: null
  # fp16-safe VAE replacement; the stock SDXL VAE produces black/NaN images in fp16.
  vae_repo: madebyollin/sdxl-vae-fp16-fix

generation:
  # Turbo-class defaults: few steps, low guidance.
  scheduler: DPMSolverSinglestepScheduler
  use_karras_sigmas: true
  steps: 6
  min_steps: 4
  max_steps: 8
  guidance_scale: 2.0
  width: 832
  height: 1216
  # Sizes offered by the CLI --size flag and the UI dropdown.
  allowed_sizes:
    - 832x1216
    - 1024x1024
  images_per_run: 1
  max_images_per_run: 4

vram:
  # 8 GB RTX 3070 Laptop strategy — do not switch to a plain .to("cuda").
  dtype: float16
  enable_model_cpu_offload: true
  enable_vae_tiling: true
  empty_cache_after_run: true

ollama:
  host: http://localhost:11434
  model: llama3.2:3b
  timeout: 5.0
  temperature: 0.7
  # 0 => llama3.2 stays on the CPU and never competes with SDXL for VRAM.
  num_gpu: 0
  system_prompt: >-
    You are a Stable Diffusion XL prompt engineer. Expand the user's idea into
    ONE comma-separated visual prompt: subjects, count of people, setting,
    lighting, mood, camera angle, clothing. Output ONLY the prompt, no quotes,
    no explanations, under 60 tokens.

style:
  suffix: ", semi-realistic 2.5D anime style, 3D-shaded characters, volumetric lighting, glossy rendering, detailed faces, cinematic composition, high detail"
  negative_prompt: "bad anatomy, deformed hands, extra fingers, extra limbs, mutated, lowres, blurry, watermark, text, jpeg artifacts, flat 2D shading"
